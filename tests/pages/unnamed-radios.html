<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unnamed radios test page</title>
  <link rel="stylesheet" href="../../dist/barely.css">
</head>
<body>
  <main>
    <h1>Unnamed radios</h1>
    <a id="first" href="#a">First link</a>
    <fieldset>
      <legend>Radios with no name</legend>
      <input id="unnamed-1" type="radio" aria-label="Unnamed one">
      <input id="unnamed-2" type="radio" aria-label="Unnamed two">
      <input id="empty-1" type="radio" name="" aria-label="Empty name one">
      <input id="empty-2" type="radio" name="" aria-label="Empty name two">
    </fieldset>
    <a id="last" href="#c">Last link</a>
  </main>
</body>
</html>
