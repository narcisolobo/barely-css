<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No main</title>
  <link rel="stylesheet" href="../../dist/barely.css">
</head>
<body>
  <h1>A page with no main</h1>
  <p>Content sits directly in the body, so the body supplies the block padding.</p>
  <section>
    <h2>Section</h2>
    <p>Still inside the content width.</p>

  <blockquote><p>A quotation placed directly in the body.</p></blockquote>
  <ul><li>First item</li><li>Second item</li></ul>
  <ol><li>One</li><li>Two</li></ol>
  <footer><a href="./">Home</a></footer>
</body>
</html>
